<section class="blog-section">
  <h2>{{ title }}</h2>
  <div class="blog-list">
    <article *ngFor="let post of posts" class="blog-card">
      <a [routerLink]="post.link">
        <div class="blog-card-content">
          <h3>{{ post.title }}</h3>
          <p>{{ post.excerpt }}</p>
        </div>
      </a>
    </article>
  </div>
  <!--a routerLink="/blog">
    <div class="see-all">{{ seeAll }}</div>
  </a-->
</section>
