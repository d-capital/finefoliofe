<section id="result">
    <h2>{{ title }}</h2>
    <p>{{ screenerDescription }}</p>
    <!-- Filters -->
    <div class="filters-container">
        <h3>{{ filterLabel }}</h3>
        <div class="filters-grid">
            <div class="filter-item">
            <label for="minDiv">{{filterMinDivLabel}}</label>
            <input id="minDiv" type="number" min="0" [(ngModel)]="filters.minDividend" placeholder="{{filterMinDivDefaultValue}}" />
            </div>
            <div class="filter-item">
            <label for="minEps">{{filterMinEpsLabel}}</label>
            <input id="minEps" type="number" min="15" [(ngModel)]="filters.minEps" placeholder="{{filterMinEpsDefaultValue}}" />
            </div>
            <div class="filter-item">
            <label for="exchange">{{exchangeLabel}}</label>
            <select id="exchange" [(ngModel)]="filters.exchange">
                <option value="">{{exchangeDefaultValue}}</option>
                <option value="NYSE">NYSE</option>
                <option value="NASDAQ">NASDAQ</option>
                <option value="MOEX">MOEX</option>
            </select>
            </div>
        </div>

        <div class="filters-actions">
            <button (click)="applyFilters()">{{ applyLabel }}</button>
        </div>
    </div>
    
    <!-- Screener Results -->
    <div class="table-container">

        <div *ngIf="loading" class="loading-skeleton">
            <div class="skeleton-row" *ngFor="let i of [1,2,3,4,5]">
                <div class="skeleton-cell" *ngFor="let j of [1,2,3,4,5]"></div>
            </div>
        </div>
        <table *ngIf="!loading" id="resultsTable">
            <thead>
                <tr>
                    <th *ngFor="let col of columns; let last = last"
                        [title]="col.full"
                        [attr.data-export-ignore]="last ? '' : null">
                        {{ col.short }}
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let r of results">
                    <td>{{r.ticker}}</td>
                    <td data-export-ignore>
                        <a class="stock-link"
                           [href]="getStockUrl(r)"
                           target="_blank"
                           rel="noopener noreferrer"
                           [attr.aria-label]="openLabel"
                           [title]="openLabel">
                            <svg class="stock-link-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <path d="M14 3h7v7"></path>
                                <path d="M10 14 21 3"></path>
                                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                            </svg>
                        </a>
                    </td>
                    <td>{{r.exchange}}</td>
                    <td>{{r.price}}</td>
                    <td>{{r.eps}}</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!--button class="download-button" (click)="exportTableToCSV()">{{ downloadLabel }}</button-->
</section>
